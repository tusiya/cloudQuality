[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudquality"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "tusiya", email = "szulcam2410@gmail.com" },
  { name = "limebel", email = "stankiewicz.huberto@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/tusiya/cloudquality#readme"
Issues = "https://github.com/tusiya/cloudquality/issues"
Source = "https://github.com/tusiya/cloudquality"

[tool.hatch.version]
path = "src/cloudquality/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/cloudquality tests}"

[tool.coverage.run]
source_pkgs = ["cloudquality", "tests"]
branch = true
parallel = true
omit = [
  "src/cloudquality/__about__.py",
]

[tool.coverage.paths]
cloudquality = ["src/cloudquality", "*/cloudquality/src/cloudquality"]
tests = ["tests", "*/cloudquality/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
